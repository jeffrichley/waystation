name: CI

on:
  # Unfiltered, `push` and `pull_request` both fire for a branch with an open
  # PR, running the whole matrix twice for one commit. Branch pushes are
  # covered by the PR run; `main` still gets a run of its own after a merge.
  push:
    branches: [main]
  pull_request:

# A new push supersedes the run already in flight for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Sync dependencies
        run: uv sync --group dev

      # The docker tier fails, rather than skips, without its image. Only the
      # Linux job builds one: the Windows runner has no Linux daemon, and
      # conftest.py skips the tier there, saying why.
      - name: Build the docker test image
        if: runner.os == 'Linux'
        run: just test-image

      - name: just check
        run: just check
