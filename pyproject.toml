[project]
name = "waystation"
version = "0.1.0"
description = "Bare Python library for orchestrating sandboxed AI coding agents"
readme = "README.md"
authors = [
    { name = "Jeff Richley", email = "jeffrichley@gmail.com" }
]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "rich",
]

[project.optional-dependencies]
# `waystation.testing` ships the sandbox conformance suite, which is pytest
# tests and loaded lazily; nothing else in the library imports pytest, so
# `ScriptedAgent` from the same package needs no extra (ADR-0044).
testing = ["pytest>=8", "pytest-asyncio>=1.4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pre-commit>=4",
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=6",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.6",
    "ruff>=0.9",
]
# What the example flow scripts need beyond the library. Run one with
# `uv run --group examples python examples/<rung>.py`; `just check` type-checks
# them against it, and CI never executes them.
examples = ["typer>=0.12"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
# tests/ too: test modules import their shared helpers as a top-level module,
# the same way pytest puts the rootdir of a test file on sys.path.
mypy_path = "src:tests"
files = ["src", "tests", "examples"]
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: pure unit tests (no git, no Docker)",
    "git: tests that need a real git binary and temp repos",
    "docker: tests that need a reachable Docker daemon",
    "live: real agent runs; never selected by default or in CI",
]
addopts = [
    "-ra",
    "--strict-markers",
    "-m",
    "not live",
    "-n",
    "auto",
    "--timeout=60",
    "--cov=waystation",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=85",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Under xdist a test that outruns `--timeout` is ended with `os._exit`, which
# reaches the log as "worker 'gwN' crashed" and nothing else — no traceback,
# no stack, nothing saying which wait wedged (#105). This dumps every thread's
# stack first. It is the one number here that must stay *below* the timeout
# above, or the worker is gone before the dump runs.
faulthandler_timeout = 45

[tool.coverage.run]
branch = true
source = ["waystation"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_empty = true
