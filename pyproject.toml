[project]
name = "waystation"
version = "0.1.0"
description = "Bare Python library for orchestrating sandboxed AI coding agents"
readme = "README.md"
authors = [
    { name = "Jeff Richley", email = "jeffrichley@gmail.com" }
]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "rich",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.6",
    "ruff>=0.9",
]

[tool.ruff]
target-version = "py312"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests"]
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: pure unit tests (no git, no Docker)",
    "git: tests that need a real git binary and temp repos",
    "docker: tests that need a reachable Docker daemon",
    "live: real agent runs; never selected by default or in CI",
]
addopts = [
    "-ra",
    "--strict-markers",
    "-m",
    "not live",
    "-n",
    "auto",
    "--timeout=60",
    "--cov=waystation",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]

[tool.coverage.run]
branch = true
source = ["waystation"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_empty = true
